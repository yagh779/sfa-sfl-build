# Build SFA (Android) + SFL (Linux .deb) for sing-box reF1nd / xiaobaf14g.
#
# How the custom core is injected (both variants):
#   * SFL: the Electron/Rust client sources the Go tree at <client>/../.., so the
#     core is checked out at the workspace root and the client at clients/desktop;
#     `cmd/internal/build_boxdd` then builds the daemon from that core.
#   * SFA: `cmd/internal/build_libbox` produces libbox.aar (gomobile) which is
#     copied into the Android app's app/libs.
#
# Build tags: a fixed set (env.BUILD_TAGS) with no with_naive_outbound.
#   * SFL: build_boxdd reads release/DEFAULT_BUILD_TAGS_OTHERS only when cgo is
#     off (CC empty), so we overwrite those files and keep CC empty -> no cronet.
#   * SFA: build_libbox hardcodes its tag list (no CLI switch), so
#     scripts/patch_build_libbox.py rewrites sharedTags to the fixed set and
#     removes the legacy (API 21) build.
#
# Caching: a `prepare` job warms the Go module cache per variant (go list -deps);
#   build jobs restore it read-only. Go build / Gradle / pnpm / cargo / zig /
#   electron caches are added alongside the built-in setup-* caches.

name: Build SFA & SFL (sing-box reF1nd / xiaobaf14g)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Build which variant'
        required: true
        type: choice
        default: both
        options:
          - both
          - xiaobaf14g
          - reF1nd
      target:
        description: 'Build which artifact'
        required: true
        type: choice
        default: both
        options:
          - both
          - sfa
          - sfl
      version_xiaobaf14g:
        description: 'xiaobaf14g 版本号（不含 v），如 1.15.0-alpha.13-xiaobaf14g.11'
        required: false
        type: string
      version_ref1nd:
        description: 'reF1nd 版本号（不含 v）；variant=both 且两者都构建时必填'
        required: false
        type: string
      prerelease:
        description: 'Mark the Release as prerelease'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Create / update the GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Re-pushing the same tag / re-dispatching cancels the previous in-flight run.
concurrency:
  group: sfa-sfl-${{ github.event_name == 'push' && github.ref_name || inputs.variant }}-${{ github.event_name == 'push' && github.ref_name || inputs.version_xiaobaf14g || inputs.version_ref1nd }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  # Fixed build tags: no with_naive_outbound (so no cronet toolchain needed).
  BUILD_TAGS: 'with_quic,with_dhcp,with_utls,with_clash_api,with_tailscale,with_xhttp,badlinkname,tfogo_checklinkname0'

jobs:
  # ── 0) Resolve variant x target matrices ────────────────────────────
  resolve:
    name: resolve matrices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prepare: ${{ steps.m.outputs.prepare }}
      sfa: ${{ steps.m.outputs.sfa }}
      sfl: ${{ steps.m.outputs.sfl }}
      meta: ${{ steps.m.outputs.meta }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - name: Resolve
        id: m
        env:
          VARIANT: ${{ inputs.variant || 'both' }}
          VERSION_XIAOBAF14G: ${{ github.event_name == 'push' && github.ref_name || inputs.version_xiaobaf14g }}
          VERSION_REF1ND: ${{ github.event_name == 'push' && github.ref_name || inputs.version_ref1nd }}
        run: python3 scripts/matrix.py

  # ── 1) Warm the shared Go module cache per variant (restore-only later) ──
  prepare:
    name: prepare modules ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.prepare) }}
    steps:
      - name: Checkout core (${{ matrix.core_repo }}@${{ matrix.core_ref }})
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.core_repo }}
          ref: ${{ matrix.core_ref }}
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go module cache
        id: gomod
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS', 'release/DEFAULT_BUILD_TAGS_OTHERS', 'release/DEFAULT_BUILD_TAGS_WINDOWS') }}
          lookup-only: true
      - name: Warm Go modules
        if: steps.gomod.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          BUILD_TAGS: ${{ env.BUILD_TAGS }}
        run: |
          set -uo pipefail
          export GOTOOLCHAIN=local
          echo "warming with tags=$BUILD_TAGS"
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go list -deps -tags "$BUILD_TAGS" ./experimental/boxdd >/dev/null 2>&1 || echo "::warning::warm boxdd deps skipped"
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go list -deps -tags "$BUILD_TAGS" ./experimental/libbox >/dev/null 2>&1 || echo "::warning::warm libbox deps skipped"
      - name: Save Go module cache
        if: steps.gomod.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS', 'release/DEFAULT_BUILD_TAGS_OTHERS', 'release/DEFAULT_BUILD_TAGS_WINDOWS') }}

  # ── 2) SFA libbox: build libbox.aar (arm64, no naive) ───────────────
  sfa-lib:
    name: SFA libbox ${{ matrix.variant }} (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [resolve, prepare]
    if: ${{ !cancelled() && (!inputs.target || inputs.target == 'both' || inputs.target == 'sfa') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.sfa) }}
    steps:
      - name: Checkout core (${{ matrix.core_repo }}@${{ matrix.core_ref }})
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.core_repo }}
          ref: ${{ matrix.core_ref }}
          fetch-depth: 0
      - name: Checkout builder scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository }}
          path: .ci
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go module cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS', 'release/DEFAULT_BUILD_TAGS_OTHERS', 'release/DEFAULT_BUILD_TAGS_WINDOWS') }}
      - name: Cache Go build (android)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-sfa-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS*') }}
          restore-keys: |
            gobuild-${{ runner.os }}-sfa-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS*') }}-
            gobuild-${{ runner.os }}-sfa-${{ matrix.variant }}-
      - name: Setup OpenJDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Locate preinstalled NDK (r28+)
        id: ndk_local
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK=""
          for dir in $(ls -d "$SDK"/ndk/*/ 2>/dev/null | sort -V -r); do
            dir="${dir%/}"
            major=$(basename "$dir" | cut -d. -f1)
            if [[ "$major" =~ ^[0-9]+$ ]] && [ "$major" -ge 28 ] && \
               [ -x "$dir/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
              NDK="$dir"; break
            fi
          done
          echo "path=$NDK" >> "$GITHUB_OUTPUT"
      - name: Setup NDK (download fallback)
        id: ndk_download
        if: steps.ndk_local.outputs.path == ''
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
      - name: Apply fixed build tags to build_libbox
        env:
          BUILD_TAGS: ${{ env.BUILD_TAGS }}
        run: |
          set -euo pipefail
          # build_libbox hardcodes its tag list (no CLI switch). Rewrite it to the
          # fixed tag set (no with_naive_outbound) and drop the legacy build.
          python3 .ci/scripts/patch_build_libbox.py
          echo "--- build_libbox sharedTags (after patch) ---"
          grep -n 'sharedTags = ' cmd/internal/build_libbox/main.go | head -n5
      - name: Build libbox (arm64, no naive)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk_local.outputs.path || steps.ndk_download.outputs.ndk-path }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          git tag -f "v${VERSION}"          # build_libbox reads version via git describe
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          ls -lh libbox.aar
      - name: Upload libbox
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: libbox-${{ matrix.variant }}
          path: libbox.aar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ── 3) SFA app: assemble APK (arm64, other flavor) ──────────────────
  sfa:
    name: SFA ${{ matrix.variant }} (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [resolve, prepare, sfa-lib]
    if: ${{ !cancelled() && needs['sfa-lib'].result == 'success' && (!inputs.target || inputs.target == 'both' || inputs.target == 'sfa') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.sfa) }}
    steps:
      - name: Checkout SFA client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.sfa_repo }}
          ref: ${{ matrix.sfa_ref }}
          path: sfa-client
          submodules: recursive
      - name: Checkout builder scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ github.repository }}
          path: .ci
      - name: Restrict ABI to arm64-v8a
        run: |
          set -euo pipefail
          python3 .ci/scripts/restrict_abi.py sfa-client/app/build.gradle.kts
          echo "--- splits.abi (after patch) ---"
          grep -n -A6 'splits {' sfa-client/app/build.gradle.kts | head -n 10
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Setup OpenJDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      - name: Locate NDK from app/build.gradle.kts
        id: ndk_local
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          WANT=$(sed -n 's/^ *ndkVersion *= *"\(.*\)".*/\1/p' sfa-client/app/build.gradle.kts)
          NDK=""
          if [ -n "$WANT" ] && [ -x "$SDK/ndk/$WANT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            NDK="$SDK/ndk/$WANT"
          fi
          echo "path=$NDK" >> "$GITHUB_OUTPUT"
      - name: Setup NDK (download fallback)
        id: ndk_download
        if: steps.ndk_local.outputs.path == ''
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r28
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          cache-provider: basic
      - name: Download libbox
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: libbox-${{ matrix.variant }}
          path: libbox-dl
      - name: Place libbox into app libs
        run: |
          set -euo pipefail
          mkdir -p sfa-client/app/libs
          cp libbox-dl/libbox.aar sfa-client/app/libs/libbox.aar
          ls -lh sfa-client/app/libs
      - name: Update version.properties
        id: version
        env:
          VERSION: ${{ matrix.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          FILE=sfa-client/version.properties
          BASE_CODE=$(sed -n 's/^VERSION_CODE=//p' "$FILE")
          VERSION_CODE=$((BASE_CODE + RUN_NUMBER))
          sed -i \
            -e "s/^VERSION_CODE=.*/VERSION_CODE=${VERSION_CODE}/" \
            -e "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" \
            -e "s/^GO_VERSION=.*/GO_VERSION=$(go env GOVERSION)/" \
            "$FILE"
          cat "$FILE"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
      - name: Build APK (other flavor)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk_local.outputs.path || steps.ndk_download.outputs.ndk-path }}
          RELEASE_KEYSTORE_FILE: ${{ secrets.SFA_KEYSTORE_FILE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.SFA_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.SFA_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SFA_KEY_PASSWORD }}
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          for NAME in RELEASE_KEYSTORE_FILE RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            [ -n "${!NAME}" ] || { echo "::error::secret ${NAME} is not configured"; exit 1; }
          done
          KEYSTORE="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_FILE" | base64 -d > "$KEYSTORE"
          cd sfa-client
          chmod +x gradlew
          # ABI 已在前面「Restrict ABI to arm64-v8a」步骤里通过改写 splits.abi 限定为仅 arm64-v8a，
          # 故这里不再传 `-Pandroid.injected.build.abi`（该 IDE 注入式参数会把产物导向 intermediates，
          # 不在 outputs/apk 生成可签名/可收集的 APK）。此处仅注入签名属性。
          ./gradlew --build-cache --parallel "$TASK" \
            -Pandroid.injected.signing.store.file="$KEYSTORE" \
            -Pandroid.injected.signing.store.password="$RELEASE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD"
      - name: Prepare upload
        env:
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          mkdir -p dist
          # 优先在标准 outputs/apk 目录递归查找已签名 release APK（split 可能在 <abi>/ 子目录），
          # 找不到再回退到整个客户端目录（排除 intermediates/unsigned/unaligned）。
          echo "== candidate signed release APKs =="
          find sfa-client -type f -path '*/outputs/apk/*' -name '*.apk' ! -name '*-unsigned.apk' -printf '%p\n' 2>/dev/null || true
          pick=$(find sfa-client -type f -path '*/outputs/apk/*' -name '*arm64-v8a*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -n1 || true)
          [ -z "$pick" ] && pick=$(find sfa-client -type f -path '*/outputs/apk/*' -name '*universal*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -n1 || true)
          [ -z "$pick" ] && pick=$(find sfa-client -type f -path '*/outputs/apk/*' -name '*.apk' ! -name '*-unsigned.apk' 2>/dev/null | head -n1 || true)
          [ -z "$pick" ] && pick=$(find sfa-client -type f -name '*.apk' ! -name '*-unsigned.apk' ! -name '*-unaligned.apk' ! -path '*/intermediates/*' 2>/dev/null | head -n1 || true)
          [ -n "$pick" ] || { echo "::error::no signed release APK found under sfa-client"; exit 1; }
          echo "picked: $pick"
          cp "$pick" "dist/SFA-${VERSION}-arm64-${VARIANT}.apk"
          ls -lh dist
      - name: Upload APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sfa-${{ matrix.variant }}
          path: dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ── 4) SFL: Linux amd64 .deb only, no naive (no cronet toolchain) ──
  sfl:
    name: SFL ${{ matrix.variant }} (amd64 deb)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: [resolve, prepare]
    if: ${{ !cancelled() && (!inputs.target || inputs.target == 'both' || inputs.target == 'sfl') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.sfl) }}
    steps:
      - name: Checkout core (${{ matrix.core_repo }}@${{ matrix.core_ref }})
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.core_repo }}
          ref: ${{ matrix.core_ref }}
          fetch-depth: 0
      - name: Checkout SFL client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ matrix.sfl_repo }}
          ref: ${{ matrix.sfl_ref }}
          path: clients/desktop
          submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Restore Go module cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/go/pkg/mod
          key: gomod-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS', 'release/DEFAULT_BUILD_TAGS_OTHERS', 'release/DEFAULT_BUILD_TAGS_WINDOWS') }}
      - name: Cache Go build (linux)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/go-build
          key: gobuild-${{ runner.os }}-sfl-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS*') }}
          restore-keys: |
            gobuild-${{ runner.os }}-sfl-${{ matrix.variant }}-${{ hashFiles('go.sum', 'release/DEFAULT_BUILD_TAGS*') }}-
            gobuild-${{ runner.os }}-sfl-${{ matrix.variant }}-
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.rust_target }}
      - name: Cache Rust (cargo + native modules)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            clients/desktop/bin/wayland-menu-toolchain
          key: cargo-${{ runner.os }}-${{ hashFiles('clients/desktop/native/wayland-menu/Cargo.lock', 'clients/desktop/native/**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: clients/desktop/package.json
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: clients/desktop/package.json
          cache: pnpm
          cache-dependency-path: |
            clients/desktop/pnpm-lock.yaml
            clients/desktop/dashboard/pnpm-lock.yaml
      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('clients/desktop/pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ runner.os }}-
      - name: Update version.json
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          jq --arg version "$VERSION" --arg go "$(go env GOVERSION)" \
            '.version = $version | .go_version = $go' \
            clients/desktop/version.json > "$RUNNER_TEMP/version.json"
          mv "$RUNNER_TEMP/version.json" clients/desktop/version.json
          cat clients/desktop/version.json
      - name: Pin core tag (build_boxdd reads version via git describe)
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          git tag -f "v${VERSION}"
      - name: Force fixed build tags (no naive)
        env:
          BUILD_TAGS: ${{ env.BUILD_TAGS }}
        run: |
          set -euo pipefail
          # build_boxdd reads release/DEFAULT_BUILD_TAGS_OTHERS when cgo is off
          # (CC empty). Force the exact tag set so no with_naive_outbound is used.
          printf '%s' "$BUILD_TAGS" > release/DEFAULT_BUILD_TAGS_OTHERS
          printf '%s' "$BUILD_TAGS" > release/DEFAULT_BUILD_TAGS
          echo "release/DEFAULT_BUILD_TAGS_OTHERS = $(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
      - name: Install package tools
        run: |
          set -euo pipefail
          sudo apt-get update || true
          sudo apt-get install -y debsigs libarchive-tools
      - name: Install dependencies
        run: pnpm -C clients/desktop install --frozen-lockfile
      - name: Build .deb (amd64, no naive)
        env:
          # Empty CC => build_boxdd uses DEFAULT_BUILD_TAGS_OTHERS (no naive) and CGO off,
          # so no cronet-go / Chromium toolchain is required.
          CC: ''
          CGO_ENABLED: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -C clients/desktop package:linux -- deb ${{ matrix.desktop_arch }}
      - name: Setup package signing
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          for NAME in GPG_KEY GPG_KEY_ID GPG_PASSPHRASE; do
            [ -n "${!NAME}" ] || { echo "::error::secret ${NAME} is not configured"; exit 1; }
          done
          SIGNING_GNUPG_HOME="$RUNNER_TEMP/package-signing-gnupg"
          SIGNING_PASSPHRASE_FILE="$RUNNER_TEMP/package-signing-passphrase"
          mkdir -m 700 "$SIGNING_GNUPG_HOME"
          printf '%s' "$GPG_PASSPHRASE" > "$SIGNING_PASSPHRASE_FILE"
          chmod 600 "$SIGNING_PASSPHRASE_FILE"
          {
            echo "GNUPGHOME=$SIGNING_GNUPG_HOME"
            echo "SIGNING_PASSPHRASE_FILE=$SIGNING_PASSPHRASE_FILE"
          } >> "$GITHUB_ENV"
          printf '%s' "$GPG_KEY" | gpg \
            --homedir "$SIGNING_GNUPG_HOME" \
            --batch --pinentry-mode loopback \
            --passphrase-file "$SIGNING_PASSPHRASE_FILE" --import
          gpg --homedir "$SIGNING_GNUPG_HOME" --batch --list-secret-keys "$GPG_KEY_ID" >/dev/null
      - name: Sign .deb
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          set -euo pipefail
          debsigs \
            --sign=origin \
            -k "$GPG_KEY_ID" \
            --gpgopts "--batch --pinentry-mode loopback --passphrase-file $SIGNING_PASSPHRASE_FILE" \
            clients/desktop/release/SFL-*.deb
      - name: Prepare upload
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(clients/desktop/release/SFL-*.deb)
          if (( ${#debs[@]} != 1 )); then
            echo "::error::expected 1 .deb, found ${#debs[@]}: ${debs[*]}"
            exit 1
          fi
          mkdir -p dist
          cp "${debs[0]}" "dist/${VARIANT}-$(basename "${debs[0]}")"
          ls -lh dist
      - name: Upload .deb
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sfl-${{ matrix.variant }}
          path: dist
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # ── 5) Publish a single Release with everything ────────────────────
  publish:
    name: publish release
    # Publish when asked AND at least one requested artifact built.
    # A single-target run skips the other build job, so don't require both.
    if: ${{ !cancelled() && inputs.publish && (needs.sfa.result == 'success' || needs.sfl.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, sfa, sfl]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: builds
          pattern: '!libbox-*'
          merge-multiple: true
      - name: Compose release notes
        id: notes
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          TARGET: ${{ inputs.target }}
          BUILD_TAGS: ${{ env.BUILD_TAGS }}
          META: ${{ needs.resolve.outputs.meta }}
          PRERELEASE: ${{ inputs.prerelease }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, glob, sys
          sys.stdout.reconfigure(encoding="utf-8")
          def human(n):
              for u in ["B", "KB", "MB", "GB", "TB"]:
                  if n < 1024:
                      return ("%.0f %s" % (n, u)) if u == "B" else ("%.1f %s" % (n, u))
                  n /= 1024.0
              return "%.1f PB" % n
          _meta_versions = json.loads(os.environ.get("META") or "[]")
          vers_txt = " / ".join("%s %s" % (m["variant"], m["version"]) for m in _meta_versions)
          tag = os.environ["TAG"]
          build_tags = os.environ["BUILD_TAGS"]
          target = os.environ.get("TARGET", "") or "both"
          meta = json.loads(os.environ.get("META") or "[]")
          pre = os.environ.get("PRERELEASE", "").lower() in ("true", "1")
          repo = os.environ["REPO"]
          server = os.environ["SERVER_URL"]
          run_id = os.environ["RUN_ID"]
          variants = [m["variant"] for m in meta]
          variants_txt = " / ".join(variants) if variants else "—"
          files = sorted(glob.glob("builds/*"))
          L = []
          L.append("# SFA / SFL — %s" % vers_txt)
          L.append("")
          L.append("- **名称 (name):** sing-box SFA/SFL")
          L.append("- **变体版本 (variant versions):** %s" % vers_txt)
          L.append("- **构建标签 (build tags):** `%s`" % build_tags)
          L.append("- **变体 (variants):** %s" % variants_txt)
          L.append("- **构建目标 (target):** `%s`" % target)
          L.append("- **发布类型 (release):** %s" % ("Pre-release" if pre else "Stable"))
          L.append("- **构建运行 (run):** [%s](%s/%s/actions/runs/%s)" % (tag, server, repo, run_id))
          L.append("")
          L.append("## 产物 (Artifacts)")
          L.append("")
          L.append("| 文件 | 大小 |")
          L.append("| --- | --- |")
          for f in files:
              L.append("| `%s` | %s |" % (os.path.basename(f), human(os.path.getsize(f))))
          L.append("")
          L.append("## 来源 (Source refs)")
          for m in meta:
              L.append("")
              L.append("### %s" % m["variant"])
              L.append("- core: `%s@%s`" % (m["core_repo"], m["core_ref"]))
              L.append("- SFA: `%s@%s`" % (m["sfa_repo"], m["sfa_ref"]))
              L.append("- SFL: `%s@%s`" % (m["sfl_repo"], m["sfl_ref"]))
          L.append("")
          L.append("## 安装 / 校验 (Install / verify)")
          L.append("")
          L.append("- **SFA**：`adb install <SFA-*.apk>`（仅 arm64-v8a，Android 7.0+/API 24+）。")
          L.append("- **SFL**：`sudo apt install ./<variant>-SFL-*.deb`；`.deb` 已用 GPG 签名（debsigs / origin）。")
          L.append("")
          body = "\n".join(L) + "\n"
          open("RELEASE_NOTES.md", "w", encoding="utf-8").write(body)
          vjoin = " + ".join(variants)
          name = "SFA/SFL " + vers_txt + ((" [%s]" % vjoin) if variants else "")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("name=" + name + "\n")
          print(body)
          PY
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ steps.notes.outputs.name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease }}
          draft: false
          files: builds/*
          fail_on_unmatched_files: true
